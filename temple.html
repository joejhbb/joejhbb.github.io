<!DOCTYPE html>
   <html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!--=============== FAVICON ===============-->
      <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">

      <!--=============== REMIXICONS ===============-->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css">

      <!--=============== SAKURA CSS ===============-->
      <link rel="stylesheet" href="">

      <!--=============== CSS ===============-->
      <link rel="stylesheet" href="/Assets/css/temple.css">

      <title>Responsive temple website - Bedimcode</title>
   </head>
   <body>
      <!--==================== HEADER ====================-->
      <header class="header" id="header">
        <nav class="nav container">
          <a href="#" class="nav__logo">
            <i class="ri-ancient-gate-line"></i>
            <span>Temple</span>
          </a>

          <div class="nav__menu" id="nav-menu">
            <ul class="nav__list">
              <li>
                <a href="#" class="nav__link">Home</a>
              </li>

              <li>
                <a href="#" class="nav__link">Location</a>
              </li>

              <li>
                <a href="#" class="nav__link">About</a>
              </li>
              
              <li>
                <a href="#" class="nav__link">Explore</a>
              </li>

              <li>
                <a href="#" class="nav__link">Contact</a>
              </li>
            </ul>

            <!-- Close button -->
             <div class="nav__close" id="nav-close">
              <i class="ri-close-large-line"></i>
             </div>
          </div>

          <!-- Toggle button -->
           <div class="nav__toggle" id="nav-toggle">
            <i class="ri-apps-2-line"></i>
           </div>
        </nav>
      </header>

      <!--==================== MAIN ====================-->
      <main class="main">
         <!--==================== HOME ====================-->
         <section class="home">
            <img src="/Assets/img/temple/img-bg.svg" alt="image" class="home__bg">

            <div class="home__container container">
              <div class="home__data">
                  <h1 class="home__title">Welcome To <br> Temple</h1>

                  <p class="home__description">
                    The temple is an attractive tourist place 
                    where you could visit and connect to the 
                    pure land of the environment, you will 
                    experience peace and harmony.
                  </p>

                  <a href="#" class="home__button">Explore Place</a>

                  <img src="/Assets/img/temple/lantern-1.svg" alt="image" class="home__lantern-1">
                  <img src="/Assets/img/temple/lantern-2.svg" alt="image" class="home__lantern-2">
              </div>

              <div class="home__images">
                  <img src="/Assets/img/temple/img-1.svg" alt="image" class="home__img-1">
                  <img src="/Assets/img/temple/img-2.svg" alt="image" class="home__img-2">
                  <img src="/Assets/img/temple/img-3.svg" alt="image" class="home__img-3">
                  <img src="/Assets/img/temple/img-4.svg" alt="image" class="home__img-4">
                  <img src="/Assets/img/temple/img-5.svg" alt="image" class="home__img-5">
                  <img src="/Assets/img/temple/img-6.svg" alt="image" class="home__img-6">
              </div>
            </div>
         </section>
      </main>

      <!-- Sakura petals -->
      
      
      <!--=============== GSAP ===============-->
      <script src=""></script>

      <!--=============== SAKURA JS ===============-->
      <script src=""></script>

   </body>
</html>
